# Deploy the website/ folder to GitHub Pages
name: Deploy website to Pages

on:
  # Only redeploy when the site (or this workflow) changes
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Publish only the website folder, relative to the repo root
          path: "website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
